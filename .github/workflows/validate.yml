name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Schemas + examples (positive)
        run: npm run validate
      - name: Negative fixtures (must all be rejected)
        run: npm run validate -- --fixtures negative
      - name: File mode accepts a valid document
        run: npm run validate -- --file examples/shadcn-ui.dspack.json
      - name: File mode rejects an invalid document
        # Guards the fail-first behavior: the pre---file harness silently
        # ignored the flag and exited 0 on this exact invocation.
        run: |
          if npm run validate -- --file fixtures/negative/rule-unknown-component-ref.dspack.json; then
            echo "file mode unexpectedly accepted a negative fixture" >&2
            exit 1
          fi
      - name: Pack-and-install boundary (bin works without devDependencies)
        # Guards the 0.4.0 defect: ajv/ajv-formats lived in devDependencies,
        # so dspack-validate crashed on every clean install while passing in
        # every checkout (npm ci installs devDeps). Install the packed
        # tarball into an empty project and run the bin as an end user would.
        run: |
          tarball="$PWD/$(npm pack --silent | tail -1)"
          dir="$(mktemp -d)"
          cd "$dir" && npm init -y >/dev/null
          npm install "$tarball"
          npx dspack-validate --file node_modules/@aestheticfunction/dspack-spec/examples/shadcn-ui.dspack.json
